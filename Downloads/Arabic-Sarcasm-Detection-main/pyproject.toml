[project]
name = "arabic-sarcasm-detection"
version = "0.1.0"
description = "Arabic Sarcasm Detection using Machine Learning, Deep Learning and Transformers"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "nltk>=3.8",
    "emoji>=2.10",
    "gensim>=4.3",
    "torch>=2.3",
    "transformers>=4.40,<5.0",
    "datasets>=2.18",
    "accelerate>=0.28",
    "sentencepiece",
    "protobuf",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "joblib",
    "tqdm"
]